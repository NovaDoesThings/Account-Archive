
name: Update Archive Count

on:
  push:
    branches:
      - main
    paths:
      - 'PlayerInformation/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count archived players
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const prefix = 'PlayerInformation/';

            const branchInfo = await github.rest.repos.getBranch({
              owner,
              repo,
              branch
            });

            const commit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: branchInfo.data.commit.sha
            });

            // Retrieve the complete recursive Git tree.
            const tree = await github.rest.git.getTree({
              owner,
              repo,
              tree_sha: commit.data.tree.sha,
              recursive: '1'
            });

            if (tree.data.truncated) {
              throw new Error(
                'Git tree was truncated. Archive count was not updated.'
              );
            }

            // Count only immediate player folders.
            const count = tree.data.tree.filter(entry =>
              entry.type === 'tree' &&
              entry.path.startsWith(prefix) &&
              !entry.path.substring(prefix.length).includes('/')
            ).length;

            const data = {
              count: count,
              updated: new Date().toISOString()
            };

            fs.writeFileSync(
              'archive-count.json',
              JSON.stringify(data, null, 2) + '\n'
            );

            core.info(`Archived players: ${count}`);

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive-count.json

          if git diff --cached --quiet; then
            echo "Archive count has not changed."
            exit 0
          fi

          git commit -m "Update archived player count"
          git push origin HEAD:main
